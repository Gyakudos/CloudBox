name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent:
    name: agent (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Verify generated version artifacts
        working-directory: .
        run: pwsh -NoProfile -File eng/version.ps1 -Check

      - name: Build
        run: go build ./...

      - name: Cross-compile (linux, darwin, windows)
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/cloudbox
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/cloudbox
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/cloudbox

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  smoke:
    name: smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: End-to-end smoke test
        run: pwsh -NoProfile -File eng/smoke.ps1

  apk:
    name: app (flutter android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain the app is developed and tested against. A moving
          # `stable` channel makes `flutter analyze` results non-reproducible: newer SDKs add
          # diagnostics that fail CI without any code change.
          flutter-version: '3.47.8'
          cache: true

      - name: Verify generated version artifacts
        run: pwsh -NoProfile -File eng/version.ps1 -Check

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/cloudbox-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cloudbox-apk
          path: dist/*.apk
          if-no-files-found: error

  pc:
    name: app (flutter windows)
    # Builds the companion app that the Windows installer bundles, while also keeping the
    # Windows Flutter project continuously validated.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as the Android app: reproducible analysis across both Flutter surfaces.
          flutter-version: '3.47.8'
          cache: true

      - name: Verify generated version artifacts
        run: pwsh -NoProfile -File eng/version.ps1 -Check

      - name: Resolve dependencies
        working-directory: pc
        run: flutter pub get

      - name: Analyze
        working-directory: pc
        run: flutter analyze

      - name: Test
        working-directory: pc
        run: flutter test

      - name: Build Windows executable
        working-directory: pc
        run: flutter build windows

      - name: Stage PC app
        run: |
          New-Item -ItemType Directory -Force dist\pc | Out-Null
          Copy-Item pc\build\windows\x64\runner\Release\* dist\pc -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: cloudbox-pc
          path: dist\pc\**
          if-no-files-found: error

  windows-installer:
    name: installer (windows)
    needs: [pc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - uses: actions/download-artifact@v4
        with:
          name: cloudbox-pc
          path: pc\build\windows\x64\runner\Release

      - name: Build agent + installer
        run: pwsh -NoProfile -File eng/build-installer.ps1 -SkipPc

      - uses: actions/upload-artifact@v4
        with:
          name: cloudbox-setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: release
    # Only on version tags; the assets are built by the jobs above and attached here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          # Only the two published artifacts. The intermediate cloudbox-pc artifact also lands
          # in dist/ (merged from the Windows job) and must not leak its loose DLLs/EXE here.
          files: |
            dist/cloudbox-*.apk
            dist/cloudbox-setup-*.exe
          generate_release_notes: true
          # CloudBox is pre-alpha: every tagged build is a pre-release, and none of them should
          # be presented as the stable "Latest" download.
          prerelease: true
          make_latest: false
