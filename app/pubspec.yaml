name: cloudbox
description: "CloudBox — back up your phone to your own PC. No cloud, no subscription."
publish_to: 'none'

# Mirror of the repository VERSION file. pub cannot express the five-part scheme
# (0.01.15.11.26) or the leading zero in "01", so the authoritative string lives in
# lib/core/gen/version.dart and the Android manifest version is overridden in
# android/app/build.gradle.kts. eng/version.ps1 keeps this line in sync.
version: 0.6.20+26112006

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pure-Dart SHA-256 for TLS certificate pinning. No native code, so it cannot break the
  # Android build.
  crypto: ^3.0.6

  # Pure-Dart BLAKE3, the content hash the transfer protocol is built on. The package only
  # exports one-shot helpers publicly, so the streaming HashContext is imported from its src/
  # (see lib/core/hashing.dart) to hash multi-gigabyte videos without loading them into RAM.
  blake3_dart: ^1.0.0

  # Native file and directory picker. Used to choose the files to back up from the phone.
  file_picker: ^13.3.3
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
