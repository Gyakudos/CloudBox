org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler aborts when a source file and the project live on different
# Windows drives: the pub cache is on C: while the checkout is on F:, and it cannot make a
# relative path between them. It then fails the build while flushing its caches. This is a
# Kotlin-side bug (KT-57286), so turn the incremental compiler off; the cost is a slower build
# on a clean CI machine, in exchange for local Windows builds that actually finish.
kotlin.incremental=false
